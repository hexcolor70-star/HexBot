name: HEX Color Video Uploader

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_upload]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Быстрый чекаут (без лишней истории)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # 2. Скачивание и распаковка архива из релизов GitHub с защитой от сбоев
      - name: Download and Extract Assets with Retry
        run: |
          for i in {1..5}; do
            echo "Attempt $i to download release asset..."
            curl -L -o HexBot-main.zip "https://github.com/hexcolor70-star/HexBot/releases/download/v1.0/HexBot-main.zip"
            
            # Проверяем, что файл скачался, весит больше 1 КБ и является валидным архивом
            if [ -f HexBot-main.zip ] && [ $(stat -c%s "HexBot-main.zip") -gt 1000 ]; then
              if unzip -tq HexBot-main.zip > /dev/null 2>&1; then
                echo "Download successful and archive is valid!"
                break
              fi
            fi
            
            echo "Download failed or archive is corrupt. Retrying in 5 seconds..."
            rm -f HexBot-main.zip
            sleep 5
          done
          
          if [ ! -f HexBot-main.zip ]; then
            echo "Error: Failed to download valid archive after 5 attempts."
            exit 1
          fi

          unzip -q HexBot-main.zip -d extracted_assets
          cp -r extracted_assets/HexBot-main/* ./
          rm -rf HexBot-main.zip extracted_assets

      - name: Install FFmpeg
        run: |
          curl -L -O https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/

      # 3. Настройка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Кэш для Python-библиотек
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Установка Python-зависимостей
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Запуск твоего скрипта
      - name: Run Script
        env:
          G_TOKEN_JSON: ${{ secrets.G_TOKEN_JSON }}
        run: python main.py

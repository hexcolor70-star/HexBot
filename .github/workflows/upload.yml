name: HEX Color Video Uploader

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger_upload]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # 1. Быстрый чекаут (без лишней истории)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install FFmpeg
        run: |
          curl -L -O https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          # Переносим бинарник в папку, доступную в PATH, или прописываем путь до него
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          

      # 3. Настройка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. Кэш для Python-библиотек (чтобы не качать каждый раз)
      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Установка Python-зависимостей
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Запуск твоего скрипта
      - name: Run Script
        env:
          G_TOKEN_JSON: ${{ secrets.G_TOKEN_JSON }}
        run: python main.py
        
